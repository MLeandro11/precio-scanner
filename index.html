<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15803d" />
    <!-- Marca Lupa: .ico con 16/32/48 adentro para todo, SVG para los navegadores
         modernos. %BASE_URL% es el reemplazo de Vite: el sitio se publica en
         /precio-scanner/, así que una ruta absoluta a secas daría 404 en prod. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>Lupa — Buscador de precios de almacén</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the
      // wrong scheme. data-theme ("light"/"dark") is a manual override;
      // absent, the CSS follows prefers-color-scheme.
      (function () {
        try {
          var el = document.documentElement;
          var t = localStorage.getItem('lupa:theme');
          if (t === 'light' || t === 'dark') {
            el.setAttribute('data-theme', t);
          } else {
            el.removeAttribute('data-theme');
          }
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#171717' : '#15803d');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
