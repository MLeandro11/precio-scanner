name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The catalog job publishes to the `datos` branch, not `main`, so a push here
  # never fires for a fresh dataset. `actualizar-catalogo.yml` dispatches this
  # event after a successful publish; without it the site would keep the catalog
  # from the last code push (T7/D7).
  repository_dispatch:
    types: [catalogo-actualizado]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate: nothing reaches the deploy job unless this passes.
  #
  # Before this job existed the workflow ran `npm ci` and `npm run build` only, so
  # typecheck and the test suite never ran in CI at all — and since a push to main
  # deploys, that meant publishing code no check had verified. (It also used to run a
  # search-asset diff against the committed catalog; T7/D7 removed it, see below.)
  verify:
    runs-on: ubuntu-latest
    # Least privilege: this job only reads. It must not hold the Pages deploy
    # credentials that the workflow grants by default.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # REMOVED (T7/D7): the "Search assets match the committed catalog" step.
      # It regenerated the index and failed if `git diff -- public/data` was dirty.
      # Once `public/data` left version control that diff is always clean, so the
      # check would pass while proving nothing — worse than no check. The guarantee
      # it stood for moved to `actualizar-catalogo.yml`, which validates the raw
      # extraction before it writes and publishes only validated files to `datos`;
      # the deploy job below then re-validates them by fetching through
      # `npm run fetch-data`.
      #
      # `--quiet` used to matter here: the assets are single-line JSON, so a plain
      # `git diff` would dump a 2 MB line into the log. There is no diff any more.

      # NOT checkable here: `npm run normalize` reads `raw-catalog.json`, which is
      # gitignored ("Raw catalog extraction (never commit; keep local only)"). CI
      # therefore cannot re-derive `public/data/catalogo.json` from its source of
      # truth, and nothing asserts that a local normalize run still reproduces the
      # committed catalog. That half of task 2.8 needs the raw input published
      # somewhere CI can reach it.

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `public/data` is generated and lives on the `datos` branch: a build with no
      # catalog publishes an app with no data (D7). `npm run fetch-data` validates
      # the three files before writing them and exits non-zero if it cannot fetch;
      # the step must fail loudly rather than build an empty catalog.
      - name: Fetch the catalog from the datos branch
        run: |
          if npm run --silent fetch-data -- --branch datos
          then
            echo "catálogo listo en public/data"
          else
            echo "::error::no se pudo bajar public/data del branch datos: un build sin catálogo publicaría una app sin datos. Se cancela el deploy."
            exit 1
          fi
      # The Firebase web config reaches the build here and nowhere else. `verify` does not
      # need it: typecheck and the tests do not depend on it, and the app is written to
      # degrade to "no auth configured" when the values are absent — which is also what
      # makes a fork, a fresh clone and a local `npm run build` work unchanged.
      #
      # Repository **variables**, not secrets: none of these is confidential. `apiKey`
      # identifies the project, it does not authorise anything on its own, and it is visible
      # in every request the browser makes anyway. Storing it as a secret would imply a
      # sensitivity it does not have and make a misconfiguration harder to diagnose.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
